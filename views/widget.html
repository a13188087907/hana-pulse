<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse 额度总览</title>
<style>
:root{color-scheme:light}
.theme-warm-paper{--bg:#F5EFE4;--fg:#2A2622;--surface:#FBF7EE;--border:#D8CFBE;--accent:#537D96;--fg-muted:#6B6158;--fg-subtle:#8F867B;--track:#E8E6DC;--accent-light:rgba(83,125,150,.08)}
.theme-dark{--bg:#141516;--fg:#E8E6E3;--surface:#1C1E20;--border:#343A40;--accent:#6E96AC;--fg-muted:#9AA1A8;--fg-subtle:#7A828A;--track:#2E3338;--accent-light:rgba(110,150,172,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--fg);font-size:13px;line-height:1.45;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
body::-webkit-scrollbar{width:3px}
body::-webkit-scrollbar-track{background:transparent}
body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.wrap{padding:10px 12px}
.muted{color:var(--fg-muted)}
.sub{font-size:11px;color:var(--fg-muted);margin-top:4px}
.warn-text{color:#9D5F4D}
.crit-text{color:#C05B4A}

.header{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px;margin-bottom:8px}
.title{font-size:14px;font-weight:600}
.header-summary{font-size:11px;color:var(--fg-muted)}

.card{
  background:var(--surface);
  border:0.5px solid var(--border);
  border-radius:5px;
  padding:9px 11px;
  margin-bottom:7px;
  cursor:pointer;
  transition:border-color .12s ease;
}
.card:hover{border-color:var(--fg-subtle)}
.card.open{border-color:var(--accent)}
.card[draggable="true"]{user-select:none}
.card.dragging{opacity:.4}
.card.drop-before{box-shadow:0 -2px 0 0 var(--accent)}
.card.drop-after{box-shadow:0 2px 0 0 var(--accent)}
.btn-danger{color:#C05B4A}
.btn-danger:hover{background:rgba(192,91,74,.08)}
.card.degraded{border-style:dashed;cursor:default}
.card.degraded:hover{border-color:var(--border)}

.card-head{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-ok{background:var(--fg-subtle)}
.dot-warn{background:#9D5F4D}
.dot-crit{background:#C05B4A}
.dot-degraded{background:transparent;border:1px solid var(--fg-muted)}
.name{font-size:12.5px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan{font-size:11px;color:var(--fg-muted)}
.tag{font-size:11px;color:var(--fg-muted)}

.metric-row{display:flex;align-items:baseline;gap:7px;margin-top:5px}
.metric{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.metric-warn{color:#9D5F4D}
.metric-crit{color:#C05B4A}

.bar{height:4px;background:var(--track);border-radius:2px;margin-top:6px;overflow:hidden}
.win-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.win-label{font-size:11px;color:var(--fg-muted);width:56px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-bar{flex:1;margin-top:0}
.win-pct{font-size:11px;width:64px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
.win-reset{margin:2px 0 4px 64px;font-size:11px;color:var(--fg-muted)}
.win-reset:last-child{margin-bottom:0}
.bar-fill{height:100%;border-radius:2px;transition:width .15s ease}
.fill-ok{background:var(--fg-subtle)}
.fill-warn{background:#9D5F4D}
.fill-crit{background:#C05B4A}

.detail{border-top:0.5px solid var(--border);margin-top:8px;padding-top:8px}
.detail-window{margin-bottom:8px}
.detail-row{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.detail-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-muted);margin-top:6px}

.empty{border:0.5px dashed var(--border);border-radius:5px;padding:14px 12px;margin-bottom:7px}
.empty-title{font-size:12.5px;font-weight:600;margin-bottom:4px}
.load-fail{font-size:11px;color:#C05B4A;padding:4px 2px}

.footer{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 0}
.footer-time{font-size:11px;color:var(--fg-muted)}
.footer-actions{display:flex;align-items:center;gap:6px}

.manage{
  border:0.5px solid var(--border);border-radius:5px;
  padding:9px 11px;margin-bottom:7px;background:var(--surface);
}
.manage-title{font-size:11px;color:var(--fg-muted);margin-bottom:8px}
.cred-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.cred-row:last-child{margin-bottom:0}
.cred-name{font-size:12px;font-weight:500;flex:0 0 auto;min-width:64px}
.cred-input{
  flex:1;min-width:0;border:0.5px solid var(--border);border-radius:4px;
  background:var(--bg);color:var(--fg);padding:4px 7px;font-size:12px;
  font-family:inherit;outline:none;
}
.cred-input:focus{border-color:var(--accent)}
.cred-msg{font-size:11px;color:var(--accent);min-width:44px;text-align:right}
.btn{
  border:0.5px solid var(--border);border-radius:5px;background:transparent;
  color:var(--accent);padding:3px 10px;font-size:12px;font-weight:500;cursor:pointer;
  font-family:inherit;
}
.btn:hover{background:var(--accent-light)}
.btn:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="sub">加载中…</div></div>
<script>
(function(){
"use strict";

// Hana 宿主在 iframe 加载后等待 {type:"ready"} 消息，超时未收到则显示“加载失败”。
// 必须最先发出，早于任何异步逻辑。
try { window.parent.postMessage({ type:"ready" }, "*"); } catch(e){}

var params = new URLSearchParams(window.location.search);
var theme = params.get("hana-theme") || "warm-paper";
document.documentElement.className = /dark|midnight|black/i.test(theme) ? "theme-dark" : "theme-warm-paper";

var BASE = window.location.pathname.replace(/\/widget\/?$/, "");
function apiUrl(path){
  var token = params.get("token") || "";
  if(!token) return BASE + path;
  var sep = path.indexOf("?") >= 0 ? "&" : "?";
  return BASE + path + sep + "token=" + encodeURIComponent(token);
}

var state = { snapshot:null, refreshing:false, failed:false, manageOpen:false, discovery:null, saving:{}, saved:{} };
var dragPid = null, dragOverPid = null, dragOverPos = null;

function resetDrag(app){
  dragPid = null;
  dragOverPid = null;
  dragOverPos = null;
  Array.prototype.forEach.call(app.querySelectorAll(".card"), function(c){
    c.classList.remove("dragging", "drop-before", "drop-after");
  });
}

function moveCard(fromPid, toPid, pos){
  if(!state.snapshot || !Array.isArray(state.snapshot.readings)) return;
  var ids = state.snapshot.readings
    .filter(function(r){ return r.status !== "unconfigured"; })
    .map(function(r){ return r.providerId; });
  var fromIdx = ids.indexOf(fromPid);
  if(fromIdx < 0 || ids.indexOf(toPid) < 0) return;
  ids.splice(fromIdx, 1);
  var insertIdx = ids.indexOf(toPid) + (pos === "after" ? 1 : 0);
  ids.splice(insertIdx, 0, fromPid);
  var rank = {};
  ids.forEach(function(id, i){ rank[id] = i; });
  state.snapshot.readings.sort(function(a, b){
    var ra = rank[a.providerId] !== undefined ? rank[a.providerId] : ids.length;
    var rb = rank[b.providerId] !== undefined ? rank[b.providerId] : ids.length;
    return ra - rb;
  });
  render();
  fetch(apiUrl("/api/order"), {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ order: ids })
  }).catch(function(){});
}

function fmtCountdown(iso){
  if(!iso) return null;
  var ms = new Date(iso).getTime() - Date.now();
  if(!isFinite(ms)) return null;
  if(ms <= 0) return "即将重置";
  var m = Math.floor(ms/60000);
  if(m >= 1440) return Math.floor(m/1440) + " 天后重置";
  if(m >= 60) return Math.floor(m/60) + "h " + (m%60) + "m 后重置";
  return m + "m 后重置";
}
function fmtUpdated(iso){
  if(!iso) return "尚未刷新";
  var ms = Date.now() - new Date(iso).getTime();
  if(!isFinite(ms) || ms < 0) return "";
  if(ms < 60000) return "刚刚更新";
  if(ms < 3600000) return Math.floor(ms/60000) + " 分钟前更新";
  return Math.floor(ms/3600000) + " 小时前更新";
}
function fmtAmount(amount, currency){
  var sym = currency === "CNY" ? "¥" : currency === "USD" ? "$" : currency + " ";
  return sym + Number(amount).toFixed(2);
}
function levelOf(used, t){
  if(used >= t.critical) return "crit";
  if(used >= t.warn) return "warn";
  return "ok";
}
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function shortLabel(label){
  return String(label || "限额").replace(/窗口$/, "");
}

function cardHtml(r, t){
  if(r.status !== "ok"){
    var label = r.status === "auth_expired" ? "凭据过期" : "读取失败";
    var hint = r.status === "auth_expired" ? "重新登录后自动恢复" : (r.error || "稍后自动重试");
    return '<div class="card degraded" data-pid="' + esc(r.providerId) + '">' +
      '<div class="card-head"><span class="dot dot-degraded"></span>' +
      '<span class="name muted">' + esc(r.name) + '</span>' +
      '<span class="tag muted">' + label + '</span></div>' +
      '<div class="sub muted">' + esc(hint) + '</div></div>';
  }

  var kindLabel = r.kind === "balance" ? "余额" : "订阅";
  var wins = (r.windows || []).slice().sort(function(a,b){ return b.usedPercent - a.usedPercent; });
  var top = wins.length ? levelOf(wins[0].usedPercent, t) : "ok";
  var h = '<div class="card" data-pid="' + esc(r.providerId) + '">';
  h += '<div class="card-head"><span class="dot dot-' + top + '"></span>' +
       '<span class="name">' + esc(r.name) + '</span>';
  if(r.plan) h += '<span class="plan">' + esc(r.plan) + '</span>';
  h += '<span class="tag">' + kindLabel + '</span></div>';

  if(r.kind === "balance"){
    var bal = (r.balances || [])[0];
    h += '<div class="metric-row"><span class="metric">' +
      (bal ? esc(fmtAmount(bal.amount, bal.currency)) : "—") + '</span>' +
      '<span class="sub" style="margin-top:0">API 余额 · 无重置窗口</span></div>';
  } else if(wins.length === 0){
    h += '<div class="sub muted">暂无窗口读数</div>';
  } else {
    for(var i = 0; i < wins.length; i++){
      var w = wins[i];
      var lvl = levelOf(w.usedPercent, t);
      var pctClass = lvl === "warn" ? "warn-text" : lvl === "crit" ? "crit-text" : "muted";
      h += '<div class="win-row">' +
        '<span class="win-label">' + esc(shortLabel(w.label)) + '</span>' +
        '<div class="bar win-bar"><div class="bar-fill fill-' + lvl + '" style="width:' + Math.min(Math.max(w.usedPercent,0),100) + '%"></div></div>' +
        '<span class="win-pct ' + pctClass + '">剩 ' + Math.round(100 - w.usedPercent) + '%</span></div>' +
        '<div class="win-reset">' + (fmtCountdown(w.resetsAt) || "重置时间未知") + '</div>';
    }
  }
  return h + '</div>';
}

function render(){
  var app = document.getElementById("app");
  // 重绘前保留管理区输入框内容：后台轮询也会触发 render，不能清掉用户输到一半的 key
  var draftValues = {};
  Array.prototype.forEach.call(app.querySelectorAll(".cred-input"), function(el){
    if(el.id) draftValues[el.id] = el.value;
  });
  var snap = state.snapshot;
  var t = (snap && snap.thresholds) || { warn:75, critical:90 };
  var readings = ((snap && snap.readings) || []).filter(function(r){ return r.status !== "unconfigured"; });

  var attention = readings.filter(function(r){
    return r.status === "ok" && (r.windows || []).some(function(w){ return w.usedPercent >= t.warn; });
  }).length;

  var h = '<div class="header"><span class="title">额度总览</span>' +
    '<span class="header-summary">' +
    (readings.length ? readings.length + " 家" + (attention ? " · " + attention + " 家需注意" : "") : "未配置") +
    '</span></div>';

  if(state.failed) h += '<div class="load-fail">面板数据读取失败，请点右下角刷新重试</div>';

  if(!state.failed && readings.length === 0){
    h += '<div class="empty"><div class="empty-title">还没有可监视的服务商</div>' +
      '<div class="sub">点下方「管理」粘贴服务商 API key，或登录 Claude Code / Codex CLI 后自动出现。</div></div>';
  }

  for(var i = 0; i < readings.length; i++){
    h += cardHtml(readings[i], t);
  }

  if(state.manageOpen) h += manageHtml();

  h += '<div class="footer"><span class="footer-time">' + fmtUpdated(snap && snap.lastPollAt) + '</span>' +
    '<span class="footer-actions">' +
    '<button class="btn" id="pulse-manage">' + (state.manageOpen ? "收起" : "管理") + '</button>' +
    '<button class="btn" id="pulse-refresh"' + (state.refreshing ? " disabled" : "") + '>' +
    (state.refreshing ? "刷新中" : "刷新") + '</button></span></div>';

  app.innerHTML = h;

  Array.prototype.forEach.call(app.querySelectorAll(".cred-input"), function(el){
    if(el.id && draftValues[el.id] !== undefined) el.value = draftValues[el.id];
  });

  var manageBtn = document.getElementById("pulse-manage");
  if(manageBtn) manageBtn.addEventListener("click", toggleManage);
  Array.prototype.forEach.call(app.querySelectorAll("[data-save-key]"), function(btn){
    btn.addEventListener("click", function(){ saveCredential(btn.getAttribute("data-save-key"), false); });
  });
  Array.prototype.forEach.call(app.querySelectorAll("[data-del-key]"), function(btn){
    btn.addEventListener("click", function(){ saveCredential(btn.getAttribute("data-del-key"), true); });
  });

  var cards = app.querySelectorAll(".card[data-pid]");
  Array.prototype.forEach.call(cards, function(el){
    var pid = el.getAttribute("data-pid");
    el.setAttribute("draggable", "true");
    el.addEventListener("dragstart", function(e){
      dragPid = pid;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", pid);
      setTimeout(function(){ el.classList.add("dragging"); }, 0);
    });
    el.addEventListener("dragend", function(){ resetDrag(app); });
    el.addEventListener("dragover", function(e){
      if(!dragPid || dragPid === pid) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      var rect = el.getBoundingClientRect();
      var pos = (e.clientY - rect.top) < rect.height / 2 ? "before" : "after";
      if(dragOverPid !== pid || dragOverPos !== pos){
        dragOverPid = pid;
        dragOverPos = pos;
        Array.prototype.forEach.call(app.querySelectorAll(".card"), function(c){
          c.classList.remove("drop-before", "drop-after");
        });
        el.classList.add(pos === "before" ? "drop-before" : "drop-after");
      }
    });
    el.addEventListener("drop", function(e){
      e.preventDefault();
      if(!dragPid || dragPid === pid) return;
      moveCard(dragPid, pid, (e.clientY - el.getBoundingClientRect().top) < el.getBoundingClientRect().height / 2 ? "before" : "after");
    });
  });
  var btn = document.getElementById("pulse-refresh");
  if(btn) btn.addEventListener("click", doRefresh);

  requestResize();
}

function manageHtml(){
  var items = (state.discovery || []).filter(function(d){ return d.type === "config-key"; });
  var h = '<div class="manage"><div class="manage-title">服务商 API key（保存在本机插件配置中）</div>';
  if(!state.discovery){
    h += '<div class="sub">读取中…</div>';
  } else if(items.length === 0){
    h += '<div class="sub">暂无可配置的服务商</div>';
  } else {
    for(var i = 0; i < items.length; i++){
      var d = items[i];
      var busy = !!state.saving[d.configKey];
      var msg = state.saved[d.configKey] || "";
      h += '<div class="cred-row">' +
        '<span class="cred-name">' + esc(d.name) + '</span>' +
        '<input class="cred-input" type="password" id="cred-' + esc(d.configKey) + '" placeholder="' +
          (d.configured ? "已配置，输入新 key 即覆盖" : "粘贴 API key") + '"' + (busy ? " disabled" : "") + '>' +
        '<button class="btn" data-save-key="' + esc(d.configKey) + '"' + (busy ? " disabled" : "") + '>' +
          (busy ? "…" : "保存") + '</button>' +
        (d.configured ? '<button class="btn btn-danger" data-del-key="' + esc(d.configKey) + '"' + (busy ? " disabled" : "") + '>删除</button>' : '') +
        '<span class="cred-msg">' + esc(msg) + '</span></div>';
    }
  }
  return h + '</div>';
}

function toggleManage(){
  state.manageOpen = !state.manageOpen;
  if(state.manageOpen && !state.discovery){
    fetch(apiUrl("/api/discovery")).then(function(res){ return res.json(); }).then(function(data){
      state.discovery = data.discovery || [];
      render();
    }).catch(function(){ state.discovery = []; render(); });
  }
  render();
}

function saveCredential(configKey, forceDelete){
  var input = document.getElementById("cred-" + configKey);
  var value = forceDelete ? "" : (input ? input.value.trim() : "");
  state.saving[configKey] = true;
  state.saved[configKey] = "";
  render();
  fetch(apiUrl("/api/credentials"), {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ key:configKey, value:value })
  }).then(function(res){ return res.json(); }).then(function(data){
    state.saving[configKey] = false;
    if(data.ok){
      state.saved[configKey] = value ? "已保存" : "已删除";
      if(input) input.value = "";
      state.snapshot = data;
      state.discovery = null;
      fetch(apiUrl("/api/discovery")).then(function(res){ return res.json(); }).then(function(d){
        state.discovery = d.discovery || [];
        render();
      }).catch(function(){ render(); });
    } else {
      state.saved[configKey] = data.error || "失败";
    }
    render();
  }).catch(function(){
    state.saving[configKey] = false;
    state.saved[configKey] = "网络错误";
    render();
  });
}

function requestResize(){
  var height = document.documentElement.scrollHeight;
  try { window.parent.postMessage({ type:"resize-request", payload:{ height:height } }, "*"); } catch(e){}
}

function load(){
  return fetch(apiUrl("/api/snapshot")).then(function(res){
    if(!res.ok) throw new Error("http " + res.status);
    return res.json();
  }).then(function(data){
    state.snapshot = data;
    state.failed = false;
  }).catch(function(){
    state.failed = true;
  }).then(render);
}

function doRefresh(){
  if(state.refreshing) return;
  state.refreshing = true;
  render();
  fetch(apiUrl("/api/refresh"), { method:"POST" }).then(function(res){
    if(!res.ok) throw new Error("http " + res.status);
    return res.json();
  }).then(function(data){
    state.snapshot = data;
    state.failed = false;
    state.refreshing = false;
  }).catch(function(){
    state.failed = true;
    state.refreshing = false;
  }).then(render);
}

load();
setInterval(load, 30000);

if(typeof ResizeObserver !== "undefined"){
  new ResizeObserver(function(){ requestResize(); }).observe(document.documentElement);
}
})();
</script>
</body>
</html>
